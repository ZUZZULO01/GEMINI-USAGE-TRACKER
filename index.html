<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Tracker</title>
  <meta name="theme-color" content="#131314" />
  
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #131314; color: #e3e3e3; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const STORAGE_KEY = 'gemini_usage_tracker_v12';

    const DEFAULT_MODELS = [
      { id: 'argon', name: 'Gemini Argon', badge: 'Ultra / Deep Reasoning', color: 'from-purple-500 to-indigo-500', border: 'border-purple-500/30', text: 'text-purple-300', costPrompt: 5.0, costFile: 12.0 },
      { id: 'pro', name: 'Gemini Pro', badge: 'Reasoning & Coding', color: 'from-blue-500 to-cyan-400', border: 'border-blue-500/30', text: 'text-blue-300', costPrompt: 3.0, costFile: 7.5 },
      { id: 'flash', name: 'Gemini Flash', badge: 'Veloce & Quotidiano', color: 'from-emerald-400 to-teal-500', border: 'border-emerald-500/30', text: 'text-emerald-300', costPrompt: 1.0, costFile: 3.0 },
      { id: 'flash-lite', name: 'Gemini Flash-Lite', badge: 'Ultra-Leggero', color: 'from-amber-400 to-orange-400', border: 'border-amber-500/30', text: 'text-amber-300', costPrompt: 0.4, costFile: 1.2 }
    ];

    function App() {
      const [remainingPct, setRemainingPct] = useState(100);
      const [resetTimestamp, setResetTimestamp] = useState(null);
      const [history, setHistory] = useState([]);
      const [now, setNow] = useState(Date.now());
      const [inputHours, setInputHours] = useState(3);
      const [inputMinutes, setInputMinutes] = useState(0);
      const [notifPermission, setNotifPermission] = useState('default');

      useEffect(() => {
        if ('Notification' in window) setNotifPermission(Notification.permission);
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (typeof parsed.remainingPct === 'number') setRemainingPct(parsed.remainingPct);
            if (parsed.resetTimestamp) setResetTimestamp(parsed.resetTimestamp);
            if (Array.isArray(parsed.history)) setHistory(parsed.history);
          }
        } catch (e) {}
      }, []);

      const requestNotificationPermission = async () => {
        if ('Notification' in window) {
          const perm = await Notification.requestPermission();
          setNotifPermission(perm);
          if (perm === 'granted') new Notification('Gemini Tracker', { body: 'Notifiche attive!' });
        }
      };

      const sendNotification = (title, body) => {
        if ('Notification' in window && Notification.permission === 'granted') {
          try { new Notification(title, { body }); } catch (e) {}
        }
      };

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ remainingPct, resetTimestamp, history }));
      }, [remainingPct, resetTimestamp, history]);

      useEffect(() => {
        const timer = setInterval(() => {
          const current = Date.now();
          setNow(current);
          if (resetTimestamp && current >= resetTimestamp) {
            setRemainingPct(100);
            setResetTimestamp(null);
            sendNotification('Quota Ripristinata! 🚀', 'Gemini è tornato al 100%.');
          }
        }, 1000);
        return () => clearInterval(timer);
      }, [resetTimestamp]);

      const updateRemaining = (newVal) => {
        const target = Math.max(0, Math.min(100, newVal));
        if (target <= 15 && remainingPct > 15 && target > 0) {
          sendNotification('Attenzione: Quota in esaurimento! ⚠️', `Ti rimane solo il ${target}% di utilizzo.`);
        } else if (target === 0 && remainingPct > 0) {
          sendNotification('Limite Esaurito! 🛑', 'Hai esaurito la quota.');
        } else if (target === 100 && remainingPct < 100) {
          sendNotification('Quota al 100% ✨', 'Capacità ripristinata.');
        }
        setRemainingPct(target);
      };

      const setCustomTimer = (hrs, mins) => {
        const totalMs = (parseInt(hrs || 0) * 3600 + parseInt(mins || 0) * 60) * 1000;
        if (totalMs > 0) {
          setResetTimestamp(Date.now() + totalMs);
        }
      };

      const usedPct = Math.max(0, Math.min(100, +(100 - remainingPct).toFixed(1)));

      const logAction = (model, type) => {
        const cost = type === 'file' ? model.costFile : model.costPrompt;
        updateRemaining(+(remainingPct - cost).toFixed(1));
        if (!resetTimestamp) {
          const defaultMs = (parseInt(inputHours || 0) * 3600 + parseInt(inputMinutes || 0) * 60) * 1000;
          setResetTimestamp(Date.now() + (defaultMs > 0 ? defaultMs : 3.5 * 3600 * 1000));
        }

        const entry = {
          id: Date.now(),
          modelName: model.name,
          cost,
          typeLabel: type === 'file' ? '📎 Allegato / File' : '💬 Prompt Testo',
          timestamp: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
        };
        setHistory(prev => [entry, ...prev.slice(0, 14)]);
      };

      const statusColor = remainingPct > 40 ? 'text-blue-400' : remainingPct > 15 ? 'text-amber-400' : 'text-rose-400';
      const barGradient = remainingPct > 40 ? 'from-blue-500 to-indigo-400' : remainingPct > 15 ? 'from-amber-500 to-orange-400' : 'from-rose-600 to-red-400';

      return (
        <div className="min-h-screen bg-[#131314] text-[#e3e3e3] p-4 md:p-8 max-w-4xl mx-auto space-y-6">
          <header className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-white/10">
            <div>
              <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                Gemini Tracker
              </h1>
            </div>
            <div className="flex items-center gap-2">
              {notifPermission !== 'granted' && (
                <button onClick={requestNotificationPermission} className="px-3 py-2 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-xs font-medium text-blue-300 transition">
                  🔔 Notifiche
                </button>
              )}
              <button onClick={() => { updateRemaining(100); setResetTimestamp(null); setHistory([]); }} className="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium transition">
                Reset 100%
              </button>
            </div>
          </header>

          <section className="bg-[#1e1f20] border border-white/10 rounded-2xl p-6 space-y-5 shadow-lg">
            <div className="flex flex-wrap items-baseline justify-between gap-2">
              <div>
                <span className="text-xs uppercase tracking-wider text-gray-400">Capacità Disponibile</span>
                <div className="flex items-baseline gap-3 mt-1">
                  <span className={`text-4xl font-extrabold ${statusColor}`}>{remainingPct.toFixed(1)}%</span>
                  <span className="text-xs text-gray-400">({usedPct}% utilizzato)</span>
                </div>
              </div>
              <div className="text-right">
                <span className="text-xs text-gray-400 block">Timer Ripristino</span>
                <span className="text-2xl font-mono font-bold text-indigo-300">
                  {resetTimestamp ? (() => {
                    const diff = Math.max(0, Math.floor((resetTimestamp - now) / 1000));
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    return `${h}:${m}:${s}`;
                  })() : '00:00:00'}
                </span>
                {resetTimestamp && (
                  <span className="block text-[11px] text-gray-400">
                    Sblocco alle {new Date(resetTimestamp).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}
                  </span>
                )}
              </div>
            </div>

            <div className="space-y-1.5">
              <div className="relative w-full h-6 bg-black/50 rounded-full p-1 border border-white/10 flex items-center cursor-pointer overflow-hidden">
                <div
                  className={`h-full rounded-full bg-gradient-to-r ${barGradient} transition-all duration-75`}
                  style={{ width: `${remainingPct}%` }}
                />
                <input
                  type="range"
                  min="0"
                  max="100"
                  step="0.5"
                  value={remainingPct}
                  onChange={(e) => updateRemaining(parseFloat(e.target.value))}
                  aria-label="Trascina la percentuale"
                  className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                />
              </div>
              <div className="flex justify-between text-[11px] text-gray-400 px-1">
                <span>Tocca o trascina la barra per regolare la %</span>
                <span className="font-mono text-gray-300">{remainingPct.toFixed(1)}%</span>
              </div>
            </div>

            <div className="pt-1 space-y-2">
              <div className="flex flex-wrap gap-2">
                {[100, 75, 50, 25, 10, 0].map(val => (
                  <button
                    key={val}
                    onClick={() => updateRemaining(val)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition border ${
                      remainingPct === val
                        ? 'bg-blue-600 text-white border-blue-400'
                        : 'bg-[#282a2c] text-gray-300 border-white/10 hover:bg-white/10'
                    }`}
                  >
                    {val}%
                  </button>
                ))}
              </div>
            </div>

            <div className="pt-3 border-t border-white/5 space-y-3 text-xs">
              <div className="flex items-center justify-between">
                <span className="text-gray-400">Imposta durata timer (Ore e Minuti):</span>
                {resetTimestamp && (
                  <button
                    onClick={() => setResetTimestamp(null)}
                    className="px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[11px]"
                  >
                    Ferma Timer
                  </button>
                )}
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {[1, 2, 3, 4, 5].map(h => (
                  <button
                    key={h}
                    onClick={() => { setInputHours(h); setInputMinutes(0); setCustomTimer(h, 0); }}
                    className="px-3 py-1.5 rounded-lg bg-[#282a2c] hover:bg-blue-500/20 border border-white/10 transition font-mono"
                  >
                    +{h}h
                  </button>
                ))}

                <div className="flex items-center gap-1.5 bg-[#282a2c] border border-white/10 rounded-lg px-2.5 py-1">
                  <span className="text-gray-400 text-[11px]">Personalizzato:</span>
                  <input
                    type="number"
                    min="0"
                    max="24"
                    value={inputHours}
                    onChange={(e) => setInputHours(e.target.value)}
                    className="w-10 bg-black/40 text-center text-white font-mono rounded px-1 py-0.5 border border-white/10 text-xs focus:outline-none focus:border-blue-500"
                  />
                  <span className="text-gray-400 text-[11px]">h</span>
                  
                  <input
                    type="number"
                    min="0"
                    max="59"
                    step="5"
                    value={inputMinutes}
                    onChange={(e) => setInputMinutes(e.target.value)}
                    className="w-10 bg-black/40 text-center text-white font-mono rounded px-1 py-0.5 border border-white/10 text-xs focus:outline-none focus:border-blue-500"
                  />
                  <span className="text-gray-400 text-[11px]">m</span>

                  <button
                    onClick={() => setCustomTimer(inputHours, inputMinutes)}
                    className="ml-1 px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white font-semibold transition text-[11px]"
                  >
                    Avvia
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {DEFAULT_MODELS.map(model => {
              const qPrompt = Math.floor(remainingPct / model.costPrompt);
              const qFile = Math.floor(remainingPct / model.costFile);
              return (
                <div key={model.id} className={`bg-[#1e1f20] border ${model.border} rounded-2xl p-5 flex flex-col justify-between space-y-4`}>
                  <div>
                    <span className="text-[11px] uppercase tracking-wider text-gray-400">{model.badge}</span>
                    <h3 className={`text-lg font-bold ${model.text}`}>{model.name}</h3>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-xs bg-black/20 p-2.5 rounded-xl border border-white/5">
                    <div>
                      <span className="text-gray-400 block text-[10px]">Testo (-{model.costPrompt}%)</span>
                      <span className="font-bold text-white text-sm">~{qPrompt} dom.</span>
                    </div>
                    <div>
                      <span className="text-gray-400 block text-[10px]">File/Img (-{model.costFile}%)</span>
                      <span className="font-bold text-amber-300 text-sm">~{qFile} file</span>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => logAction(model, 'prompt')} disabled={remainingPct <= 0} className="py-2.5 px-2 rounded-xl font-semibold text-xs text-white bg-[#282a2c] hover:bg-white/10 border border-white/10 disabled:opacity-30 transition text-center">
                      💬 +1 Testo
                    </button>
                    <button onClick={() => logAction(model, 'file')} disabled={remainingPct <= 0} className={`py-2.5 px-2 rounded-xl font-semibold text-xs text-white bg-gradient-to-r ${model.color} opacity-90 hover:opacity-100 disabled:opacity-30 transition shadow text-center`}>
                      📎 +1 File
                    </button>
                  </div>
                </div>
              );
            })}
          </section>

          {history.length > 0 && (
            <section className="bg-[#1e1f20] border border-white/10 rounded-2xl p-4 space-y-2">
              <span className="text-xs text-gray-400 font-medium">Ultime azioni registrate:</span>
              <div className="flex flex-wrap gap-2">
                {history.map((item) => (
                  <div
                    key={item.id}
                    className="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs bg-[#282a2c] border border-white/5"
                  >
                    <span className="font-semibold text-gray-200">{item.modelName}</span>
                    <span className="text-gray-300">{item.typeLabel}</span>
                    <span className="text-amber-300 font-mono">-{item.cost}%</span>
                    <span className="text-[10px] text-gray-400">{item.timestamp}</span>
                  </div>
                ))}
              </div>
            </section>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
