<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Tracker</title>
  <meta name="theme-color" content="#131314" />
  
  <!-- Icona personalizzata con sfondo nero -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23131314'/%3E%3Cpath d='M256 100c-15 75-75 135-150 150 75 15 135 75 150 150 15-75 75-135 150-150-75-15-135-75-150-150z' fill='url(%23grad)'/%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='106' y1='100' x2='406' y2='400' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23ea4335'/%3E%3Cstop offset='30%25' stop-color='%23fbbc04'/%3E%3Cstop offset='60%25' stop-color='%2334a853'/%3E%3Cstop offset='100%25' stop-color='%234285f4'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23131314'/%3E%3Cpath d='M256 100c-15 75-75 135-150 150 75 15 135 75 150 150 15-75 75-135 150-150-75-15-135-75-150-150z' fill='url(%23grad)'/%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='106' y1='100' x2='406' y2='400' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23ea4335'/%3E%3Cstop offset='30%25' stop-color='%23fbbc04'/%3E%3Cstop offset='60%25' stop-color='%2334a853'/%3E%3Cstop offset='100%25' stop-color='%234285f4'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E" />
  
  <!-- Web App Manifest con sfondo nero -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
    %22name%22: %22Gemini Tracker%22,
    %22short_name%22: %22Gemini Tracker%22,
    %22start_url%22: %22./%22,
    %22display%22: %22standalone%22,
    %22background_color%22: %22%23131314%22,
    %22theme_color%22: %22%23131314%22,
    %22icons%22: [
      {
        %22src%22: %22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23131314'/%3E%3Cpath d='M256 100c-15 75-75 135-150 150 75 15 135 75 150 150 15-75 75-135 150-150-75-15-135-75-150-150z' fill='url(%23grad)'/%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='106' y1='100' x2='406' y2='400' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23ea4335'/%3E%3Cstop offset='30%25' stop-color='%23fbbc04'/%3E%3Cstop offset='60%25' stop-color='%2334a853'/%3E%3Cstop offset='100%25' stop-color='%234285f4'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E%22,
        %22sizes%22: %22512x512%22,
        %22type%22: %22image/svg+xml%22
      }
    ]
  }">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #131314; color: #e3e3e3; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEY = 'gemini_usage_tracker_v5';

    const DEFAULT_MODELS = [
      {
        id: 'argon',
        name: 'Gemini Argon',
        badge: 'Ultra / Deep Reasoning',
        color: 'from-purple-500 to-indigo-500',
        border: 'border-purple-500/30',
        text: 'text-purple-300',
        costPrompt: 5.0,
        costFile: 12.0
      },
      {
        id: 'pro',
        name: 'Gemini Pro',
        badge: 'Reasoning & Coding',
        color: 'from-blue-500 to-cyan-400',
        border: 'border-blue-500/30',
        text: 'text-blue-300',
        costPrompt: 3.0,
        costFile: 7.5
      },
      {
        id: 'flash',
        name: 'Gemini Flash',
        badge: 'Veloce & Quotidiano',
        color: 'from-emerald-400 to-teal-500',
        border: 'border-emerald-500/30',
        text: 'text-emerald-300',
        costPrompt: 1.0,
        costFile: 3.0
      },
      {
        id: 'flash-lite',
        name: 'Gemini Flash-Lite',
        badge: 'Ultra-Leggero',
        color: 'from-amber-400 to-orange-400',
        border: 'border-amber-500/30',
        text: 'text-amber-300',
        costPrompt: 0.4,
        costFile: 1.2
      }
    ];

    function App() {
      const [remainingPct, setRemainingPct] = useState(100);
      const [resetTimestamp, setResetTimestamp] = useState(null);
      const [history, setHistory] = useState([]);
      const [now, setNow] = useState(Date.now());
      const [customHours, setCustomHours] = useState(4);
      const [notifPermission, setNotifPermission] = useState('default');

      useEffect(() => {
        if ('Notification' in window) {
          setNotifPermission(Notification.permission);
        }
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (typeof parsed.remainingPct === 'number') setRemainingPct(parsed.remainingPct);
            if (parsed.resetTimestamp) setResetTimestamp(parsed.resetTimestamp);
            if (Array.isArray(parsed.history)) setHistory(parsed.history);
          }
        } catch (e) {}
      }, []);

      const requestNotificationPermission = async () => {
        if ('Notification' in window) {
          const perm = await Notification.requestPermission();
          setNotifPermission(perm);
          if (perm === 'granted') {
            new Notification('Gemini Tracker', {
              body: 'Notifiche attive!'
            });
          }
        }
      };

      const sendNotification = (title, body) => {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, { body });
          } catch (e) {}
        }
      };

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ remainingPct, resetTimestamp, history }));
      }, [remainingPct, resetTimestamp, history]);

      useEffect(() => {
        const timer = setInterval(() => {
          const current = Date.now();
          setNow(current);
          if (resetTimestamp && current >= resetTimestamp) {
            setRemainingPct(100);
            setResetTimestamp(null);
            sendNotification('Quota Ripristinata! 🚀', 'Gemini è tornato al 100%.');
          }
        }, 1000);
        return () => clearInterval(timer);
      }, [resetTimestamp]);

      const updateRemaining = (newVal) => {
        const target = Math.max(0, Math.min(100, newVal));
        if (target <= 15 && remainingPct > 15 && target > 0) {
          sendNotification('Attenzione: Quota in esaurimento! ⚠️', `Ti rimane solo il ${target}% di utilizzo.`);
        } else if (target === 0 && remainingPct > 0) {
          sendNotification('Limite Esaurito! 🛑', 'Hai esaurito la quota.');
        } else if (target === 100 && remainingPct < 100) {
          sendNotification('Quota al 100% ✨', 'Capacità ripristinata.');
        }
        setRemainingPct(target);
      };

      const usedPct = Math.max(0, Math.min(100, +(100 - remainingPct).toFixed(1)));

      const logAction = (model, type) => {
        const cost = type === 'file' ? model.costFile : model.costPrompt;
        updateRemaining(+(remainingPct - cost).toFixed(1));
        
        if (!resetTimestamp) {
          setResetTimestamp(Date.now() + customHours * 3600 * 1000);
        }

        const entry = {
          id: Date.now(),
          modelName: model.name,
          cost,
          typeLabel: type === 'file' ? '📎 Allegato / File' : '💬 Prompt Testo',
          timestamp: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
        };
        setHistory(prev => [entry, ...prev.slice(0, 14)]);
      };

      const startTimerHours = (hrs) => {
        setResetTimestamp(Date.now() + hrs * 3600 * 1000);
      };

      const statusColor = remainingPct > 40 ? 'text-blue-400' : remainingPct > 15 ? 'text-amber-400' : 'text-rose-400';
      const barGradient = remainingPct > 40 ? 'from-blue-500 to-indigo-400' : remainingPct > 15 ? 'from-amber-500 to-orange-400' : 'from-rose-600 to-red-400';

      return (
        <div className="min-h-screen bg-[#131314] text-[#e3e3e3] p-4 md:p-8 max-w-4xl mx-auto space-y-6">
          <header className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-white/10">
            <div>
              <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                Gemini Tracker
              </h1>
              <p className="text-xs text-gray-400">Monitoraggio quota con icona dark mode</p>
            </div>
            <div className="flex items-center gap-2">
              {notifPermission !== 'granted' && (
                <button
                  onClick={requestNotificationPermission}
                  className="px-3 py-2 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-xs font-medium text-blue-300 transition"
                >
                  🔔 Notifiche
                </button>
              )}
              <button
                onClick={() => { updateRemaining(100); setResetTimestamp(null); setHistory([]); }}
                className="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium transition"
              >
                Reset 100%
              </button>
            </div>
          </header>

          <section className="bg-[#1e1f20] border border-white/10 rounded-2xl p-6 space-y-5 shadow-lg">
            <div className="flex flex-wrap items-baseline justify-between gap-2">
              <div>
                <span className="text-xs uppercase tracking-wider text-gray-400">Capacità Disponibile</span>
                <div className="flex items-baseline gap-3 mt-1">
                  <span className={`text-4xl font-extrabold ${statusColor}`}>{remainingPct.toFixed(1)}%</span>
                  <span className="text-xs text-gray-400">({usedPct}% utilizzato)</span>
                </div>
              </div>
              <div className="text-right">
                <span className="text-xs text-gray-400 block">Timer Ripristino</span>
                <span className="text-2xl font-mono font-bold text-indigo-300">
                  {resetTimestamp ? (() => {
                    const diff = Math.max(0, Math.floor((resetTimestamp - now) / 1000));
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    return `${h}:${m}:${s}`;
                  })() : '00:00:00'}
                </span>
                {resetTimestamp && (
                  <span className="block text-[11px] text-gray-400">
                    Sblocco alle {new Date(resetTimestamp).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}
                  </span>
                )}
              </div>
            </div>

            <div className="w-full h-4 bg-black/40 rounded-full overflow-hidden p-0.5 border border-white/5">
              <div
                className={`h-full rounded-full bg-gradient-to-r ${barGradient} transition-all duration-300`}
                style={{ width: `${remainingPct}%` }}
              />
            </div>

            <div className="pt-2 space-y-2">
              <div className="flex justify-between text-xs text-gray-400">
                <span>Allineamento rapido %:</span>
              </div>
              <div className="flex flex-wrap gap-2">
                {[100, 75, 50, 25, 10, 0].map(val => (
                  <button
                    key={val}
                    onClick={() => updateRemaining(val)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition border ${
                      remainingPct === val
                        ? 'bg-blue-600 text-white border-blue-400'
                        : 'bg-[#282a2c] text-gray-300 border-white/10 hover:bg-white/10'
                    }`}
                  >
                    {val}%
                  </button>
                ))}
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-white/5 text-xs">
              <span className="text-gray-400">Durata stimata sblocco:</span>
              <div className="flex flex-wrap gap-2">
                {[1, 2, 3, 4, 5].map(h => (
                  <button
                    key={h}
                    onClick={() => startTimerHours(h)}
                    className="px-2.5 py-1.5 rounded-lg bg-[#282a2c] hover:bg-blue-500/20 border border-white/10 transition"
                  >
                    +{h}h
                  </button>
                ))}
                {resetTimestamp && (
                  <button
                    onClick={() => setResetTimestamp(null)}
                    className="px-2.5 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/30"
                  >
                    Ferma Timer
                  </button>
                )}
              </div>
            </div>
          </section>

          <section className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {DEFAULT_MODELS.map(model => {
              const qPrompt = Math.floor(remainingPct / model.costPrompt);
              const qFile = Math.floor(remainingPct / model.costFile);
              return (
                <div
                  key={model.id}
                  className={`bg-[#1e1f20] border ${model.border} rounded-2xl p-5 flex flex-col justify-between space-y-4`}
                >
                  <div className="flex items-start justify-between">
                    <div>
                      <span className="text-[11px] uppercase tracking-wider text-gray-400">{model.badge}</span>
                      <h3 className={`text-lg font-bold ${model.text}`}>{model.name}</h3>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs bg-black/20 p-2.5 rounded-xl border border-white/5">
                    <div>
                      <span className="text-gray-400 block text-[10px]">Solo Testo (-{model.costPrompt}%)</span>
                      <span className="font-bold text-white text-sm">~{qPrompt} dom.</span>
                    </div>
                    <div>
                      <span className="text-gray-400 block text-[10px]">Con File/Img (-{model.costFile}%)</span>
                      <span className="font-bold text-amber-300 text-sm">~{qFile} file</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => logAction(model, 'prompt')}
                      disabled={remainingPct <= 0}
                      className="py-2.5 px-2 rounded-xl font-semibold text-xs text-white bg-[#282a2c] hover:bg-white/10 border border-white/10 disabled:opacity-30 transition text-center"
                    >
                      💬 +1 Testo
                    </button>
                    <button
                      onClick={() => logAction(model, 'file')}
                      disabled={remainingPct <= 0}
                      className={`py-2.5 px-2 rounded-xl font-semibold text-xs text-white bg-gradient-to-r ${model.color} opacity-90 hover:opacity-100 disabled:opacity-30 transition shadow text-center`}
                    >
                      📎 +1 File / Img
                    </button>
                  </div>
                </div>
              );
            })}
          </section>

          {history.length > 0 && (
            <section className="bg-[#1e1f20] border border-white/10 rounded-2xl p-4 space-y-2">
              <span className="text-xs text-gray-400 font-medium">Ultime azioni registrate:</span>
              <div className="flex flex-wrap gap-2">
                {history.map((item) => (
                  <div
                    key={item.id}
                    className="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs bg-[#282a2c] border border-white/5"
                  >
                    <span className="font-semibold text-gray-200">{item.modelName}</span>
                    <span className="text-gray-300">{item.typeLabel}</span>
                    <span className="text-amber-300 font-mono">-{item.cost}%</span>
                    <span className="text-[10px] text-gray-400">{item.timestamp}</span>
                  </div>
                ))}
              </div>
            </section>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
